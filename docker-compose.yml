services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-meridian}
      POSTGRES_USER: ${POSTGRES_USER:-meridian}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-meridian} -d ${POSTGRES_DB:-meridian}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    ports:
      - "5434:5432"
    restart: unless-stopped

  api:
    build: .
    command: >
      sh -c "alembic upgrade head &&
             uvicorn api.main:app --host 0.0.0.0 --port 8000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-meridian}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-meridian}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      AI_ENABLED: ${AI_ENABLED:-false}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      LANGUAGES: ${LANGUAGES:-python,javascript,typescript,go,rust}
    ports:
      - "8001:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  collector:
    build: .
    command: python -m collector.scheduler
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-meridian}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-meridian}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      COLLECT_INTERVAL_HOURS: ${COLLECT_INTERVAL_HOURS:-6}
      LANGUAGES: ${LANGUAGES:-python,javascript,typescript,go,rust}
      REPOS_PER_LANGUAGE: ${REPOS_PER_LANGUAGE:-100}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "3001:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  postgres_data:
